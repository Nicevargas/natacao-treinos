name: Publicar treino do dia

on:
  # Gatilho principal: o n8n chama a API de dispatches às 06:00 de Brasília.
  # Disparo por API roda na hora -- não passa pela fila do `schedule`, que em
  # 30/08 atrasou cinco horas (disparou 11:24 em vez de 06:13).
  repository_dispatch:
    types: [publicar-treino]

  # Rede de segurança, para o caso de o n8n estar fora do ar. Sai atrasado,
  # mas sai. Se o n8n já publicou, estas execuções veem o carrossel do dia na
  # conta e saem sem fazer nada.
  schedule:
    # Horários em UTC; Brasília é UTC-3 e não tem mais horário de verão, então
    # isto vale o ano inteiro.
    #
    # NUNCA no minuto zero: o agendador do GitHub adia o evento `schedule` em
    # carga alta, e o início de cada hora é justamente o pico. Com "0 9" a
    # execução de 29/08 não aconteceu -- não atrasou, foi pulada.
    #
    # Três tentativas em vez de uma. A primeira que rodar publica; as seguintes
    # veem o dia já publicado e saem sem fazer nada, então redundância aqui não
    # vira post duplicado.
    - cron: "13 9 * * *"    # 06:13 em Brasília
    - cron: "43 9 * * *"    # 06:43 -- rede, se a primeira for adiada
    - cron: "23 10 * * *"   # 07:23 -- última chance do dia
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não publica)"
        type: boolean
        default: true
      data:
        description: "Data AAAA-MM-DD (vazio = hoje)"
        required: false

# Necessário para commitar os slides: a Meta não aceita upload de arquivo, só
# URL pública, e quem serve essa URL é o raw deste próprio repositório.
permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar o Chromium
        run: python -m playwright install --with-deps chromium

      - name: Conferir o programa de treinos
        run: python scripts/treino.py

      - name: Identidade do commit das imagens
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar
        env:
          # O token vem do segredo; o resto é fixo e pode ficar à vista.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          INSTAGRAM_USERNAME: natacaocriativa
          INSTAGRAM_API_BASE: https://graph.instagram.com
          META_API_VERSION: v23.0
          GITHUB_REPO_DIR: ${{ github.workspace }}
          GITHUB_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/publicadas
          # O runner roda em UTC. Sem isto, date.today() daria o dia errado
          # sempre que a execução cruzasse a meia-noite de Brasília.
          TZ: America/Sao_Paulo
        run: |
          ARGS=""
          if [ -n "${{ inputs.data }}" ]; then ARGS="$ARGS --data ${{ inputs.data }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/postar_treino.py $ARGS

      - name: Guardar o registro do dia
        if: ${{ inputs.dry_run != true }}
        run: |
          git add publicadas
          if ! git diff --cached --quiet; then
            git commit -m "Registro do treino publicado"
            git push origin main
          fi

      - name: Guardar os slides como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: cards/
          retention-days: 7
